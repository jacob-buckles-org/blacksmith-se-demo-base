name: "SE: Decommission demo pool"

# Deletes the entire pooled demo fleet — the rare "tear the whole thing down"
# button. Pool repos are discovered by the blacksmith-se-demo-pool topic that
# reset.yml applies. Under the pool model repos are reused, not accumulated, so
# there is no routine age-based cleanup; this only exists to remove the pool
# wholesale (e.g. retiring the demo setup).
#
# Requires org secret DEMO_PROVISION_TOKEN (repo + delete_repo scopes).

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List matching repos without deleting them"
        type: boolean
        default: true

env:
  TARGET_ORG: jacob-buckles-org
  POOL_TOPIC: blacksmith-se-demo-pool
  GH_TOKEN: ${{ secrets.DEMO_PROVISION_TOKEN }}

jobs:
  decommission:
    name: Decommission pool${{ inputs.dry_run && ' (dry run)' || '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Find and delete pool repos
        run: |
          set -euo pipefail
          MATCHES=$(gh repo list "$TARGET_ORG" --topic "$POOL_TOPIC" --limit 200 \
            --json nameWithOwner --jq '.[].nameWithOwner')

          if [ -z "$MATCHES" ]; then
            echo "No repos with topic $POOL_TOPIC in $TARGET_ORG."
            exit 0
          fi

          echo "Pool repos:"
          echo "$MATCHES"

          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "Dry run — nothing deleted."
            exit 0
          fi

          for REPO in $MATCHES; do
            gh repo delete "$REPO" --yes
            echo "deleted $REPO"
          done
