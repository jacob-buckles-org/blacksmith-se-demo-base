name: "SE: Rebuild demo repos"

# Redistributes this repo's CURRENT app/ + workflows/<overlay> to the
# permanent demo repos:
#
#   app/ + workflows/current/    -> se-demo-app             (migrated)
#   app/ + workflows/unmigrated/ -> se-demo-app-unmigrated   (before state)
#
# Neither repo resets and nothing force-pushes. Each run clones the target's
# current main, replaces its tracked content with app/ (at repo root) + the
# matching workflows/ set (under .github/workflows/), and pushes a single
# normal commit. That preserves Actions run history — Codesmith and test
# analytics both need it accumulated — and leaves every other branch alone:
# the standing migration-wizard PR on se-demo-app-unmigrated, and any open
# scenario PR on se-demo-app (see "SE: Simulate PR activity").
#
# Rebuilding se-demo-app is also how you reset main back to the canonical
# app/ after merging a scenario PR, which is what keeps scenarios replayable.
#
# Run this only when you deliberately change app/ or a workflow file, not
# per-demo. Creates the target repo(s) as PUBLIC on first use — public
# repos get unlimited free Actions minutes, which matters if the org's
# billing/spending limit is ever blocking private-repo runs. Fine here
# since both repos hold only a synthetic demo app.
#
# Requires org secret DEMO_PROVISION_TOKEN: a PAT with repo + workflow
# scopes on the target org.

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Which repo(s) to rebuild"
        type: choice
        options: [current, unmigrated, both]
        default: both

env:
  TARGET_ORG: jacob-buckles-org
  GH_TOKEN: ${{ secrets.DEMO_PROVISION_TOKEN }}

jobs:
  rebuild:
    name: Rebuild ${{ inputs.target }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild target repo(s)
        run: |
          set -euo pipefail
          git config --global user.name "Usage Analytics"
          git config --global user.email "eng@usage-analytics.example"

          case "${{ inputs.target }}" in
            current)    KEYS="current" ;;
            unmigrated) KEYS="unmigrated" ;;
            both)       KEYS="current unmigrated" ;;
            *) echo "::error::unknown target '${{ inputs.target }}'"; exit 1 ;;
          esac

          BASE="$GITHUB_WORKSPACE"

          for KEY in $KEYS; do
            case "$KEY" in
              current)
                NAME="se-demo-app"
                DESC="Usage Analytics — service metrics dashboard (migrated to Blacksmith)"
                ;;
              unmigrated)
                NAME="se-demo-app-unmigrated"
                DESC="Usage Analytics — service metrics dashboard"
                ;;
            esac
            REPO="${TARGET_ORG}/${NAME}"
            echo "::group::Rebuild ${REPO}"

            if ! gh repo view "$REPO" >/dev/null 2>&1; then
              # Public, not private: public repos get unlimited free Actions
              # minutes, sidestepping the org's billing/spending-limit gate.
              # Fine for a synthetic demo app with no real customer data.
              gh repo create "$REPO" --public --description "$DESC"
              echo "created $REPO"
            fi

            rm -rf work && mkdir work
            git clone -q "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" work
            cd work

            if git rev-parse --verify -q main >/dev/null; then
              git checkout -q main
            else
              git checkout -q --orphan main
            fi

            # Replace tracked content with the current app/ + workflows/<KEY>,
            # keeping .git and any untracked build output out of the diff.
            git ls-files -z | xargs -0 -r rm -f
            find . -mindepth 1 -maxdepth 1 ! -name .git -type d -empty -delete

            cp -R "$BASE/app/." .
            mkdir -p .github/workflows
            cp "$BASE"/workflows/"$KEY"/*.yml .github/workflows/

            git add -A
            if git diff --cached --quiet; then
              echo "no changes for $REPO"
            else
              git commit -q -m "Sync from blacksmith-se-demo-base ($KEY)"
              git push -q origin HEAD:main
              echo "pushed update to $REPO"
            fi

            cd ..
            echo "::endgroup::"
            echo "- [${NAME}](https://github.com/${REPO})" >> "$GITHUB_STEP_SUMMARY"
          done
