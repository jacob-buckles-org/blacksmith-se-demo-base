name: "SE: Generate CI activity"

# "Goose it now" button: re-triggers the ci/test/docker workflows in a
# target demo repo on demand, on top of whatever the repo's schedule:
# triggers are already doing. No commits — just workflow_dispatch runs
# against the target repo's current main, so it works regardless of
# state and never touches the standing migration-wizard PR branch.
#
# Requires org secret DEMO_PROVISION_TOKEN (repo + workflow scopes).

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Which repo to goose"
        type: choice
        options: [current, unmigrated, both]
        default: both
      count:
        description: "Times to trigger each workflow"
        default: "1"

env:
  TARGET_ORG: jacob-buckles-org
  GH_TOKEN: ${{ secrets.DEMO_PROVISION_TOKEN }}

jobs:
  activity:
    name: Activity → ${{ inputs.target }} (×${{ inputs.count }})
    runs-on: ubuntu-latest
    steps:
      - name: Trigger workflow runs
        run: |
          set -euo pipefail

          case "${{ inputs.target }}" in
            current)    NAMES="se-demo-app" ;;
            unmigrated) NAMES="se-demo-app-unmigrated" ;;
            both)       NAMES="se-demo-app se-demo-app-unmigrated" ;;
            *) echo "::error::unknown target '${{ inputs.target }}'"; exit 1 ;;
          esac

          COUNT="${{ inputs.count }}"

          for NAME in $NAMES; do
            REPO="${TARGET_ORG}/${NAME}"
            if ! gh repo view "$REPO" >/dev/null 2>&1; then
              echo "::warning::$REPO does not exist; skipping (run 'SE: Rebuild demo repos' to create it)"
              continue
            fi

            echo "::group::Activity → ${REPO}"
            for WORKFLOW in ci.yml test.yml docker.yml; do
              for i in $(seq 1 "$COUNT"); do
                gh workflow run "$WORKFLOW" --repo "$REPO" --ref main
                echo "triggered $WORKFLOW ($i/$COUNT) on $REPO"
              done
            done
            echo "::endgroup::"
            echo "- ${COUNT}× ci/test/docker triggered on [${NAME}](https://github.com/${REPO}/actions)" >> "$GITHUB_STEP_SUMMARY"
          done
