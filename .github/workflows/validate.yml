name: Validate

# Base-repo CI: fast correctness checks so app/ and workflows/ changes
# can't break the demo repos before the next "SE: Rebuild demo repos" run.
# Deliberately quick (minimal workload, one Node version, one browser) —
# the slow "before" experience belongs to se-demo-app-unmigrated, not here.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  METRICS_WORKLOAD: "1"

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Install Playwright (chromium)
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: E2E tests (chromium)
        run: npm run test:e2e -- --project=chromium

  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: metrics
          POSTGRES_PASSWORD: metrics
          POSTGRES_DB: metrics
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U metrics"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    defaults:
      run:
        working-directory: app/backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: app/backend/go.mod
          cache-dependency-path: app/backend/go.sum

      - name: Build and vet
        run: |
          go build ./...
          go vet ./...
          go vet -tags integration ./...

      - name: Verify generated events are current
        run: |
          go run ./tools/genevents
          git diff --exit-code internal/events/

      - name: Unit tests
        run: go test -count=1 ./...

      - name: Integration tests
        env:
          DATABASE_URL: postgres://metrics:metrics@localhost:5432/metrics
        run: go test -count=1 -tags integration ./internal/store/

  workflows-lint:
    name: Workflow overlays sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: workflows/current and workflows/unmigrated parse as YAML
        run: |
          for f in workflows/current/*.yml workflows/unmigrated/*.yml; do
            python3 -c "import yaml,sys; yaml.safe_load(open(sys.argv[1]))" "$f" && echo "ok: $f"
          done

  # Mirrors the stack-smoke job both demo repos run. Kept here so a change to
  # app/ that breaks the compose stack fails in this repo, not at demo time.
  # Note the -f: in demo repos the compose file sits at the root, here it's
  # under app/.
  stack-smoke:
    name: Full-stack smoke (docker compose)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Bring up the stack
        run: docker compose -f app/docker-compose.yml up -d --build

      - name: Smoke-test the API
        run: |
          curl -fsS --retry 30 --retry-delay 2 --retry-all-errors \
            http://localhost:8080/healthz
          curl -fsS http://localhost:8080/api/metrics | head -c 200
          echo

      - name: Smoke-test the dashboard
        run: |
          curl -fsS --retry 30 --retry-delay 2 --retry-all-errors \
            http://localhost:4173/ -o /dev/null

      - name: Stack logs
        if: failure()
        run: docker compose -f app/docker-compose.yml logs --no-color

      - name: Tear down
        if: always()
        run: docker compose -f app/docker-compose.yml down -v
